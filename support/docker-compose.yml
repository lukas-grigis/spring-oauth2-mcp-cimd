name: spring-oauth2-mcp

services:
  # Reverse proxy: gives Keycloak a stable external URL at http://localhost/auth (so the OIDC issuer is
  # identical for the browser and the host-run authorization server, the federation back-channel client)
  # and fronts the CIMD client metadata document at http://localhost/cimd-client/client.json.
  traefik:
    image: "${TRAEFIK_IMAGE}"
    restart: "unless-stopped"

    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"

    ports:
      - "${WEB_PORT}:80"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  # Postgres backs BOTH Keycloak (realm store) and the authorization server (OAuth2 stores). Published to
  # the host so the host-run authorization server can reach the `authserver` database.
  database:
    image: "${POSTGRES_IMAGE}"
    restart: "unless-stopped"

    env_file:
      - "database/.env"

    ports:
      - "${DB_PORT}:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    volumes:
      # postgres:18 stores data in a version-specific subdir, so mount the parent (not /data).
      - "database-data:/var/lib/postgresql"
      - "./database/init-scripts:/docker-entrypoint-initdb.d:ro"

  # Keycloak — the upstream IdP. HTTP only; Traefik routes /auth to it. No compose healthcheck on purpose:
  # the mise tasks gate readiness by polling /auth/realms/master before provisioning.
  keycloak:
    image: "${KEYCLOAK_IMAGE}"
    restart: "unless-stopped"

    depends_on:
      database:
        condition: service_healthy
      traefik:
        condition: service_started

    env_file:
      - "keycloak/.env"

    command:
      - "start-dev"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.routers.keycloak.service=keycloak"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  # Static host for the demo Client ID Metadata Document. The served URL
  # (http://localhost/cimd-client/client.json) IS the MCP client's client_id: the authorization
  # server dereferences it at authorization time and validates the document — no registration
  # step, nothing stored. nginx serves .json as application/json and sends no Cache-Control,
  # so the authorization server caches the document with the library's default short TTL (5 min).
  cimd-client:
    image: "${NGINX_IMAGE}"
    restart: "unless-stopped"

    depends_on:
      traefik:
        condition: service_started

    volumes:
      - "./cimd-client:/usr/share/nginx/html/cimd-client:ro"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cimd.rule=PathPrefix(`/cimd-client`)"
      - "traefik.http.routers.cimd.entrypoints=web"
      - "traefik.http.routers.cimd.service=cimd"
      - "traefik.http.services.cimd.loadbalancer.server.port=80"

volumes:
  database-data: { }
